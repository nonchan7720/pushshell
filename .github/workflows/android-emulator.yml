name: Android Emulator

# KVM を有効化した ubuntu ランナーで Android エミュレータを起動し、release APK (x86_64) を
# インストールして起動、スクリーンショットと logcat を Artifact に保存する。
# WebView にはランナー上で配信する examples/webapp を、バックエンドには PUSH_PROVIDER=log の
# Go サーバーを使う (エミュレータからはホストが 10.0.2.2 で見える)。
# push token の取得 (FCM) は資格情報が必要なので対象外。

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level"
        type: string
        default: "36"
      system_image_tag:
        description: "system image のタグ (default = AOSP, google_apis = Play services あり)"
        type: choice
        options: [default, google_apis]
        default: default

permissions:
  contents: read

jobs:
  apk:
    name: build release apk (x86_64)
    uses: ./.github/workflows/android-apk.yml
    with:
      webapp_url: "http://10.0.2.2:8090/index.html"
      api_base_url: "http://10.0.2.2:8080"
      push_provider: native
      uses_cleartext_traffic: true
      build_type: release
      architectures: x86_64

  emulator:
    name: run on emulator (API ${{ inputs.api_level }})
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.apk.outputs.artifact_name }}
          path: out/apk

      - name: Start backend and web app on the runner
        run: |
          cd backend && go build -o ../out/server ./cmd/server && cd ..
          mkdir -p out/data
          (ADDR=:8080 API_KEY=ci PUSH_PROVIDER=log DB_AUTO_MIGRATE=true \
            DB_DSN="file:out/data/ci.db?_pragma=foreign_keys(1)" nohup ./out/server > out/server.log 2>&1 &)
          (cd examples/webapp && nohup python3 -m http.server 8090 --bind 0.0.0.0 > ../../out/static.log 2>&1 &)
          sleep 3
          curl -sf localhost:8080/healthz
          curl -sf -o /dev/null localhost:8090/index.html

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level }}-${{ inputs.system_image_tag }}-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.system_image_tag }}
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.system_image_tag }}
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/emulator-smoke.sh "out/apk/${{ needs.apk.outputs.apk_path }}" out/smoke com.example.webappnotification 30 60 120

      - name: Collect logs
        if: always()
        run: |
          cp out/server.log out/static.log out/smoke/ 2>/dev/null || true
          ls -la out/smoke || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-emulator-smoke-${{ github.run_id }}
          path: out/smoke
          retention-days: 14
