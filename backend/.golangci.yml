version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    generated: lax
    paths:
      - internal/ent
      - internal/api/api.gen.go
      - internal/transport/httpapi/openapivalidate/spec.gen.go
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/ent
      - internal/api/api.gen.go
      - internal/transport/httpapi/openapivalidate/spec.gen.go
