openapi: 3.0.3
info:
  title: WebApp Notification API
  version: 1.0.0
  description: |
    WebView ラッパーアプリと通知バックエンドの間の契約。

    - **アプリ → バックエンド**: Web アプリでログインしたときに、ログイン ID と
      プッシュ通知用の端末情報を登録する (`POST /v1/devices`)。ログアウト時に解除する。
    - **任意のサーバー → バックエンド**: ログイン ID・installationId・全端末 (ブロードキャスト)
      のいずれかを宛先にしてプッシュ通知を送る (`POST /v1/notifications`)。API キーで保護される。

    このファイルから Go サーバー (oapi-codegen) と TypeScript クライアント型
    (openapi-typescript) の両方が生成される。
servers:
  - url: http://localhost:8080
    description: ローカル開発

tags:
  - name: system
  - name: devices
    description: 端末登録 (アプリから呼ぶ)
  - name: notifications
    description: 通知送信 (サーバー間で呼ぶ)

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: ヘルスチェック
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: 端末を登録 / 更新する
      description: |
        `installationId` をキーに端末を upsert し、`loginId` をその端末に紐付ける。
        端末とログイン ID は多対多 (1 端末に複数アカウント、1 アカウントに複数端末)。
        既に紐付いている場合は端末情報 (トークン等) だけ更新する。Web アプリのログイン時にアプリが呼び出す。
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "200":
          description: 登録済みの端末
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/devices/{installationId}:
    parameters:
      - $ref: "#/components/parameters/InstallationId"
    get:
      tags: [devices]
      operationId: getDevice
      summary: 端末を取得する
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: 端末
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [devices]
      operationId: unregisterDevice
      summary: 端末の登録を解除する (全ログイン ID の紐付けごと削除)
      security:
        - {}
        - bearerAuth: []
      responses:
        "204":
          description: 解除した (存在しなかった場合も 204)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/devices/{installationId}/logins/{loginId}:
    parameters:
      - $ref: "#/components/parameters/InstallationId"
      - name: loginId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
    delete:
      tags: [devices]
      operationId: unregisterDeviceLogin
      summary: 端末から特定のログイン ID の紐付けだけを外す (そのユーザーのログアウト時)
      description: |
        端末自体とトークンは残るので、別のアカウントでログイン中ならそちらの通知は届き続ける。
        アプリから呼ぶほか、Web アプリのバックエンドがセッション失効時に API キーで呼んでもよい
        (installationId は bridge の `ready` イベントで Web アプリに渡る)。
      security:
        - {}
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "204":
          description: 解除した (存在しなかった場合も 204)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/logins/{loginId}:
    parameters:
      - name: loginId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
    delete:
      tags: [devices]
      operationId: unregisterLogin
      summary: ログイン ID を全端末から外す (サーバー間)
      description: |
        Web アプリ側でセッションが失効・無効化された (全端末ログアウト、退会など) ときに
        Web アプリのバックエンドから呼ぶ。以後そのログイン ID 宛の通知はどの端末にも届かない。
        端末自体とトークンは残る (別アカウントの通知には影響しない)。
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: 解除した端末数
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
                    description: 紐付けを外した端末数 (0 でも 200)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/notifications:
    post:
      tags: [notifications]
      operationId: sendNotification
      summary: プッシュ通知を送る (ログイン ID / installationId / 全端末)
      description: |
        宛先は `loginIds` (そのログイン ID に紐づく全端末)、`installationIds` (端末を直接指定)、
        `broadcast: true` (登録済みの全端末) のいずれか。`loginIds` と `installationIds` は併用でき、
        その場合は和集合を端末単位で重複排除して 1 端末 1 通だけ送る。`broadcast` は他の宛先と併用できない。
        `filter` で宛先をプラットフォームやロケールで絞り込める。
        `url` を指定するとアプリは通知タップ時にその URL を WebView で開く。
        TTL・優先度・サイレント通知などの配信オプションは `SendNotificationRequest` を参照。
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "200":
          description: 送信結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNotificationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: サーバー間通信用 API キー (環境変数 `API_KEY`)
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Web アプリがログイン時に postMessage で渡した任意のトークン。
        バックエンド側の `Authorizer` 実装で検証する (デフォルトは検証なし)。

  parameters:
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string

    Platform:
      type: string
      enum: [ios, android]

    DeviceRegistration:
      type: object
      description: |
        `pushToken` (Expo Push Token) と `deviceToken` (FCM / APNs のネイティブトークン) は
        どちらか一方以上が必須。バックエンドの `PUSH_PROVIDER` が `expo` なら pushToken、
        `native` なら deviceToken が送信に使われる。
      required: [loginId, installationId, platform]
      properties:
        loginId:
          type: string
          description: Web アプリのログイン ID (postMessage で受け取ったもの)
          minLength: 1
          maxLength: 256
        installationId:
          type: string
          description: アプリインストールごとに生成される安定した ID
          minLength: 1
          maxLength: 128
        platform:
          $ref: "#/components/schemas/Platform"
        pushToken:
          type: string
          description: Expo Push Token (`ExponentPushToken[...]`)。`PUSH_PROVIDER=expo` で使う
          minLength: 1
          maxLength: 512
        deviceToken:
          type: string
          description: ネイティブのデバイストークン (Android は FCM registration token、iOS は APNs device token の hex)。`PUSH_PROVIDER=native` で使う
          minLength: 1
          maxLength: 4096
        appId:
          type: string
          description: バンドル ID / パッケージ名
          maxLength: 256
        appVersion:
          type: string
          maxLength: 64
        buildNumber:
          type: string
          maxLength: 64
        osVersion:
          type: string
          maxLength: 64
        deviceModel:
          type: string
          maxLength: 128
        locale:
          type: string
          maxLength: 32

    DeviceInfo:
      type: object
      description: 端末情報 (ログイン ID を含まない DeviceRegistration)
      required: [installationId, platform]
      properties:
        installationId:
          type: string
          minLength: 1
          maxLength: 128
        platform:
          $ref: "#/components/schemas/Platform"
        pushToken:
          type: string
          maxLength: 512
        deviceToken:
          type: string
          maxLength: 4096
        appId:
          type: string
          maxLength: 256
        appVersion:
          type: string
          maxLength: 64
        buildNumber:
          type: string
          maxLength: 64
        osVersion:
          type: string
          maxLength: 64
        deviceModel:
          type: string
          maxLength: 128
        locale:
          type: string
          maxLength: 32

    Device:
      allOf:
        - $ref: "#/components/schemas/DeviceInfo"
        - type: object
          required: [id, loginIds, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            loginIds:
              type: array
              description: この端末に紐付いているログイン ID (多対多)
              items:
                type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    NotificationFilter:
      type: object
      description: |
        宛先端末の絞り込み条件。指定した条件はすべて満たす (AND) 必要があり、
        各条件の配列内は「いずれかに一致」(OR) になる。
      properties:
        platforms:
          type: array
          description: このプラットフォームの端末だけに送る
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/Platform"
        locales:
          type: array
          description: |
            端末の `locale` に対する BCP 47 タグの前置一致 (大文字小文字を区別しない、タグ境界で判定)。
            `ja` は `ja` と `ja-JP` に一致するが `jav` には一致しない。`ja-JP` は `ja-JP` (と `ja-JP-...`) にだけ一致する。
            `locale` が未登録の端末はどのロケール指定にも一致しない
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 32

    SendNotificationRequest:
      type: object
      description: |
        宛先は `loginIds` / `installationIds` / `broadcast: true` のうち少なくとも 1 つが必須。
        `broadcast: true` は `loginIds` / `installationIds` と併用できない (400)。

        `silent` が false (既定) のときは `title` が必須。`silent: true` のときは `title` / `body` /
        `sound` / `badge` / `subtitle` / `image` を指定できない (データのみのサイレント通知)。
      properties:
        loginIds:
          type: array
          description: このログイン ID に紐づく全端末に送る
          minItems: 1
          maxItems: 1000
          items:
            type: string
        installationIds:
          type: array
          description: |
            この installationId の端末に直接送る。`loginIds` と併用した場合は和集合
            (同じ端末には 1 通だけ送る)。存在しない installationId は黙って無視する
          minItems: 1
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 128
        broadcast:
          type: boolean
          description: true なら登録済みの全端末に送る (`filter` で絞り込み可)。`loginIds` / `installationIds` とは併用できない
        filter:
          $ref: "#/components/schemas/NotificationFilter"
        title:
          type: string
          description: 通知タイトル。`silent` が false のときは必須
          maxLength: 256
        body:
          type: string
          maxLength: 4096
        url:
          type: string
          format: uri
          description: 通知タップ時に WebView で開く URL
        data:
          type: object
          additionalProperties: true
          description: 任意の付加データ (アプリ側に `data` としてそのまま渡る)
        badge:
          type: integer
        sound:
          type: string
          description: iOS のサウンド ("default" など)
        channelId:
          type: string
          description: Android の通知チャンネル ID
        ttl:
          type: integer
          description: |
            通知を保持する秒数 (0 〜 2419200 = 28 日)。この時間内に端末へ届けられなければ破棄される。
            Expo は `ttl`、FCM は `android.ttl`、APNs は `apns-expiration` (現在時刻 + ttl の UNIX 秒) に対応する。
            未指定ならプッシュサービスの既定値に従う
          minimum: 0
          maximum: 2419200
        priority:
          type: string
          description: |
            配信優先度。`high` (既定、従来どおりの挙動) は即時配信、`normal` は省電力を優先して遅延することがある。
            Expo は `priority`、FCM は `android.priority` (`high` / `normal`)、APNs は `apns-priority` (10 / 5) に対応する。
            `silent: true` の APNs は Apple の要件により常に 5 になる
          enum: [high, normal]
          default: high
        collapseKey:
          type: string
          description: |
            同じキーの未配信の通知を 1 つにまとめる (最新のものだけ残す)。
            FCM は `android.collapse_key`、APNs は `apns-collapse-id` に対応する。
            **Expo は非対応のため無視される**
          minLength: 1
          maxLength: 64
        image:
          type: string
          format: uri
          description: |
            通知に表示する画像の URL (絶対 http(s) URL)。
            Expo は `richContent.image`、FCM は `notification.image` に対応する。
            **APNs は Notification Service Extension なしでは表示できないため無視される**
          maxLength: 2048
        silent:
          type: boolean
          description: |
            true ならサイレント通知 (データのみの通知)。画面には何も表示せず、`data` だけをアプリに届ける。
            Expo は `title` / `body` / `sound` / `badge` を省いて `_contentAvailable: true` を付け、
            FCM は `notification` を省いて `data` だけ送り、
            APNs は `apns-push-type: background` / `apns-priority: 5` / `aps.content-available: 1` で送る。
            `title` / `body` / `sound` / `badge` / `subtitle` / `image` とは併用できない (400)。`data` は空でもよい
          default: false
        subtitle:
          type: string
          description: |
            通知のサブタイトル (iOS)。Expo は `subtitle`、APNs は `aps.alert.subtitle` に対応する。
            **FCM (Android) は非対応のため無視される**
          maxLength: 256
        threadId:
          type: string
          description: |
            iOS の通知グループ化 ID。APNs の `aps.thread-id` に対応する。
            **Expo と FCM は非対応のため無視される**
          maxLength: 64
        interruptionLevel:
          type: string
          description: |
            iOS 15 以降の割り込みレベル。Expo は `interruptionLevel`、APNs は `aps.interruption-level` に対応する。
            **FCM (Android) は非対応のため無視される**
          enum: [passive, active, time-sensitive, critical]

    SendNotificationResult:
      type: object
      required: [requested, sent, failed, results]
      properties:
        requested:
          type: integer
          description: 宛先端末数 (`filter` 適用後)
        sent:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryResult"

    DeliveryResult:
      type: object
      description: 端末ごとの送信結果。同じ端末が複数の宛先 (ログイン ID / installationId) に該当しても 1 通にまとめる
      required: [installationId, loginIds, status]
      properties:
        installationId:
          type: string
        loginIds:
          type: array
          description: |
            リクエストの loginIds のうち、この端末に紐付いていたもの。
            `installationIds` / `broadcast` だけで選ばれた端末では空配列
          items:
            type: string
        status:
          type: string
          enum: [ok, error]
        error:
          type: string
          description: プッシュサービスからのエラー内容
        unregistered:
          type: boolean
          description: トークン失効により端末登録を削除した場合 true
